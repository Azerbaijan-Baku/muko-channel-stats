<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign-in finished · Muko Channel Stats</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1 id="title">TikTok sign-in finished</h1>
  <p id="msg">You can close this page.</p>
  <!-- The code stays in this browser: the local setup script receives it through the clipboard, never through a server. -->
  <button type="button" id="copy" hidden>Copy sign-in code</button>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const code = q.get("code"), state = q.get("state"), err = q.get("error");
  const msg = document.getElementById("msg"), btn = document.getElementById("copy");
  if (err) {
    document.getElementById("title").textContent = "TikTok sign-in was not completed";
    msg.textContent = q.get("error_description") || err;
  } else if (code) {
    btn.hidden = false;
    btn.onclick = async () => {
      await navigator.clipboard.writeText(JSON.stringify({ code, state }));
      btn.textContent = "Copied";
    };
  }
  history.replaceState(null, "", location.pathname);  // keep the code out of the address bar and history
</script>
</body>
</html>
